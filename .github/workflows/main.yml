name: CI for Streamlit App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  streamlit-ci:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Lint (flake8)
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv || true

      - name: 🚀 Run Streamlit app test
        run: |
          nohup streamlit run src/app.py > streamlit.log 2>&1 &
          sleep 10
          curl -f http://localhost:8501 || exit 1

      - name: ✅ Done
        run: echo "🎉 Streamlit CI test completed successfully!"
